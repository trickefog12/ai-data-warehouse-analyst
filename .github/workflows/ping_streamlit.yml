name: Keep Streamlit App Warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit health
        run: |
          set -e
          URL="https://ai-data-warehouse-analyst-pnvmvqtubkga8zk4knpzxw.streamlit.app/_stcore/health"
          echo "Pinging: $URL"
          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 3 --retry-all-errors \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            "$URL"